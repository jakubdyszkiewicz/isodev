# yaml-language-server: $schema=https://jakubdyszkiewicz.github.io/isodev/config.schema.json
# Claude Code with your host login, settings and transcripts.
image: isodev-claude-code:latest
build:
  context: image
environment:
  # Optional: only needed for --dangerously-skip-permissions. Containers run as
  # root, and Claude Code refuses that flag as root unless this is set.
  IS_SANDBOX: "1"
volumes:
  # Login, settings and transcripts, shared with the host.
  - type: bind
    source: ~/.claude
    target: /root/.claude
lifecycle:
  on_exec:
    # Alternative credentials, passed to commands when set on the host.
    forward_env_vars: [ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN]
