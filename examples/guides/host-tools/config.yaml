# yaml-language-server: $schema=https://isodev.dyszkiewicz.me/config.schema.json
# A command-line tool from the host, with the variable it needs.
image: isodev-host-tools:latest
build:
  context: image
volumes:
  # The tool from the host. It must run in the container.
  - type: bind
    source: ~/.local/bin/mytool
    target: /usr/local/bin/mytool
    read_only: true
lifecycle:
  on_exec:
    # Passed to every command that Isodev runs in the container, when set on the host.
    forward_env_vars: [MYTOOL_VAR]
