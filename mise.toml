[tools]
go = "1.24"
goreleaser = "2"
hugo-extended = "0.170"
lychee = "0.24"
golangci-lint = "2.15"

[tasks.build]
description = "Build bin/isodev for this machine"
run = "go build -o bin/isodev ."

[tasks.install-local-bin]
description = "Build and install isodev to ~/.local/bin"
run = "mkdir -p \"$HOME/.local/bin\" && go build -o \"$HOME/.local/bin/isodev.new\" . && mv \"$HOME/.local/bin/isodev.new\" \"$HOME/.local/bin/isodev\""

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.lint]
description = "Lint Go code with golangci-lint (.golangci.yml)"
run = "golangci-lint run"

[tasks.check]
description = "Run go vet and validate the GoReleaser configuration"
run = ["go vet ./...", "goreleaser check"]

[tasks.generate]
description = "Regenerate the command and configuration references in docs/"
run = "go generate ./..."

[tasks."docs:serve"]
description = "Serve the documentation site with live reload on port 1313 of all interfaces"
# A root-relative base URL (without the port) keeps links and assets working when
# the site is opened from another host. Rendering to memory leaves docs/public/
# to docs:build.
run = "hugo server --source docs --bind 0.0.0.0 --baseURL / --appendPort=false --renderToMemory"

[tasks."docs:build"]
description = "Build the documentation site into docs/public/ and check its internal links"
run = [
  "rm -rf docs/public",
  "hugo --source docs --minify --gc",
  "lychee --offline --no-progress --root-dir \"$PWD/docs/public\" --include-fragments --index-files index.html docs/public",
]

[tasks.snapshot]
description = "Build release archives for all platforms into dist/ without publishing"
run = "goreleaser release --snapshot --clean"
