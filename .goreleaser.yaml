# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release configuration. Try it locally with `mise run snapshot`; pushing a
# v* tag publishes a GitHub release through .github/workflows/release.yml.
version: 2

project_name: isodev

builds:
  - main: .
    binary: isodev
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    # Reproducible builds: binaries get the commit time, not the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Default names: isodev_<version>_<os>_<arch>.tar.gz, including LICENSE and README.md.
  - formats: [tar.gz]

checksum:
  algorithm: sha256

changelog:
  use: github-native

# `brew install jakubdyszkiewicz/tap/isodev` installs the release archives
# through a cask in github.com/jakubdyszkiewicz/homebrew-tap. Publishing needs
# HOMEBREW_TAP_GITHUB_TOKEN, a token that can push to that repository.
homebrew_casks:
  - name: isodev
    binaries: [isodev]
    homepage: https://isodev.dyszkiewicz.me/
    description: One container per Git worktree for parallel work
    repository:
      owner: jakubdyszkiewicz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_msg_template: "isodev {{ .Tag }}"
    # The binaries aren't signed or notarized, so macOS would refuse to run
    # them after a download; remove the quarantine attribute on install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/isodev"]
          end
